controller: nmpc
backend: casadi_ipopt
acados_backend_status: optional_not_wired
horizon: 10
dt: 0.1
wheelbase: 2.8
weights:
  q_position: 10.0
  q_heading: 4.0
  q_velocity: 2.0
  r_accel: 0.2
  r_steer: 0.4
  rd_accel: 0.05
  rd_steer: 0.10
solver:
  name: IPOPT
  max_solver_iterations: 100
constraints:
  velocity_min: 0.0
  velocity_max: 15.0
  accel_min: -4.0
  accel_max: 2.0
  steer_min: -0.5
  steer_max: 0.5
  steer_rate_max: 0.2
