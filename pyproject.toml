[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vmodel-control-pipeline"
version = "0.1.0"
description = "V-model-inspired validation pipeline for optimization-based control algorithms."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Project Maintainer" }
]
license = { text = "MIT" }
keywords = [
  "control",
  "optimization",
  "mpc",
  "nmpc",
  "validation",
  "commonroad",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "casadi>=3.7",
  "cvxpy>=1.4",
  "numpy>=1.26",
  "osqp>=0.6",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "coverage[toml]>=7.4",
  "pytest>=8.0",
  "ruff>=0.4",
]
tracking = [
  "dvc>=3.50",
  "mlflow>=2.12",
]
commonroad = [
  "commonroad-io",
  "matplotlib>=3.8",
]

[project.urls]
Repository = "https://example.com/vmodel-control-pipeline"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "unit: fast unit tests",
  "integration: integration tests",
  "benchmark: benchmark and smoke tests",
  "sil: software-in-the-loop validation tests",
  "hil: HIL-lite validation tests",
]

[tool.coverage.run]
branch = true
source = ["vcp"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []
